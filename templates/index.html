<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reasoning RAG Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #060914;
      --bg-1: #0c1120;
      --bg-2: #111b2e;
      --panel: rgba(14, 22, 38, 0.82);
      --panel-soft: rgba(24, 32, 50, 0.7);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #edf2ff;
      --text-soft: #b7c2db;
      --muted: #8391ae;
      --brand: #6b7dff;
      --brand-2: #4f46e5;
      --ok: #10b981;
      --danger: #ef4444;
      --user-bubble: linear-gradient(140deg, #5d6bff, #4e46e5);
      --bot-bubble: rgba(18, 28, 45, 0.88);
      --chip: rgba(255, 255, 255, 0.08);
      --radius: 16px;
      --radius-lg: 20px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 900px at -10% -20%, #27366c 0%, transparent 55%),
        radial-gradient(900px 700px at 100% -20%, #172e59 0%, transparent 45%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-2) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 18px;
      overflow: hidden;
    }

    .app {
      width: min(1300px, 100%);
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--panel-border);
      background: linear-gradient(180deg, rgba(13, 20, 35, 0.9), rgba(10, 15, 26, 0.85));
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .brand {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c89ff, #4f46e5);
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand p {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .new-chat-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #f8f9ff;
      background: linear-gradient(120deg, #6072ff, #4f46e5);
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.2s ease;
    }

    .new-chat-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }

    .history-title {
      font-size: 11px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 16px 8px;
    }

    .history-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 10px 12px;
    }

    .history-item {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      padding: 10px;
      margin-bottom: 8px;
      text-align: left;
      cursor: pointer;
      color: var(--text-soft);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .history-item.active {
      background: rgba(107, 125, 255, 0.16);
      border-color: rgba(131, 147, 255, 0.5);
      color: #f1f4ff;
    }

    .history-item-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .history-item .topic {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
    }

    .delete-btn:hover { color: #ffd2d2; }

    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      min-height: 0;
    }

    .header {
      height: 66px;
      padding: 0 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 18, 31, 0.68);
      backdrop-filter: blur(6px);
    }

    .header .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .left h2 {
      font-size: 15px;
      font-weight: 700;
    }

    .header .left p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.12);
      color: #7af4c6;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .chat-area {
      overflow-y: auto;
      padding: 24px;
      min-height: 0;
      background: linear-gradient(180deg, rgba(10, 17, 30, 0.25), rgba(6, 10, 18, 0.2));
    }

    .welcome {
      max-width: 760px;
      margin: 8vh auto 0;
      text-align: center;
    }

    .welcome h3 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .welcome p {
      color: var(--text-soft);
      font-size: 15px;
      margin-bottom: 22px;
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      text-align: left;
    }

    .prompt-btn {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.03);
      color: #ebefff;
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.45;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .prompt-btn:hover {
      background: rgba(107, 125, 255, 0.14);
      border-color: rgba(131, 147, 255, 0.6);
    }

    .messages {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
    }

    .message.user .avatar {
      border-color: rgba(141, 157, 255, 0.6);
      background: rgba(106, 124, 255, 0.3);
    }

    .message-body { max-width: 80%; min-width: 0; }

    .bubble {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 13px 15px;
      line-height: 1.65;
      font-size: 14px;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border-color: transparent;
      color: #ffffff;
      border-bottom-right-radius: 6px;
      white-space: pre-wrap;
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      color: #ebefff;
      border-bottom-left-radius: 6px;
    }

    .markdown p { margin: 0 0 8px; }
    .markdown p:last-child { margin-bottom: 0; }
    .markdown ul, .markdown ol { margin: 0 0 8px 20px; }
    .markdown li { margin-bottom: 4px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      margin: 10px 0 6px;
      font-weight: 700;
      line-height: 1.3;
    }
    .markdown h1 { font-size: 18px; }
    .markdown h2 { font-size: 16px; }
    .markdown h3 { font-size: 15px; }
    .markdown h4 { font-size: 14px; }
    .markdown a {
      color: #9db0ff;
      text-decoration: none;
      border-bottom: 1px dashed rgba(157, 176, 255, 0.5);
    }
    .markdown a:hover { color: #c8d2ff; }
    .markdown code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .markdown pre {
      margin: 8px 0;
      padding: 12px 14px;
      background: rgba(6, 10, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow-x: auto;
      font-size: 12.5px;
      line-height: 1.55;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .markdown pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: inherit;
    }
    .markdown blockquote {
      margin: 8px 0;
      padding: 6px 12px;
      border-left: 3px solid rgba(131, 147, 255, 0.6);
      background: rgba(131, 147, 255, 0.08);
      color: var(--text-soft);
      border-radius: 6px;
    }
    .markdown table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12.5px;
      width: 100%;
    }
    .markdown th, .markdown td {
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 6px 10px;
      text-align: left;
    }
    .markdown th {
      background: rgba(255, 255, 255, 0.06);
      font-weight: 600;
    }
    .markdown hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin: 10px 0;
    }

    .message-meta {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chip-row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: var(--chip);
      font-size: 11px;
      color: #dce4ff;
      padding: 4px 8px;
      line-height: 1.3;
    }

    .chip.ok {
      border-color: rgba(16, 185, 129, 0.4);
      color: #93f5d0;
      background: rgba(16, 185, 129, 0.16);
    }

    details.panel {
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    details.panel > summary {
      cursor: pointer;
      list-style: none;
      font-size: 12px;
      font-weight: 600;
      color: #dbe2ff;
      padding: 10px 12px;
      border-bottom: 1px solid transparent;
    }

    details.panel[open] > summary {
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    .panel-body {
      padding: 10px 12px 12px;
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.55;
    }

    .evidence-item {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 8px;
    }

    .evidence-item:last-child { margin-bottom: 0; }

    .evidence-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--text-soft);
      animation: bounce 0.9s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    .input-bar {
      border-top: 1px solid var(--panel-border);
      padding: 14px 20px 16px;
      background: rgba(9, 14, 25, 0.8);
    }

    .input-wrap {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 10px 10px 14px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .input-wrap:focus-within {
      border-color: rgba(131, 147, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
    }

    #question-input {
      flex: 1;
      border: none;
      background: transparent;
      color: #edf2ff;
      font-size: 14px;
      line-height: 1.55;
      resize: none;
      max-height: 170px;
      outline: none;
      font-family: inherit;
    }

    #question-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(120deg, #6072ff, #4f46e5);
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .send-btn:hover:not(:disabled) { transform: scale(1.04); filter: brightness(1.08); }
    .send-btn:disabled { cursor: not-allowed; opacity: 0.45; }

    .hint {
      max-width: 900px;
      margin: 8px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 360px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      background: rgba(51, 17, 20, 0.92);
      color: #ffd7db;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      box-shadow: var(--shadow);
      display: none;
    }

    .toast.show { display: block; }

    .empty-history {
      margin: 18px 8px;
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 960px) {
      body { padding: 0; }
      .app {
        border-radius: 0;
        border: none;
        grid-template-columns: 1fr;
      }
      .sidebar { display: none; }
      .prompt-grid { grid-template-columns: 1fr; }
      .chat-area { padding: 18px 14px; }
      .header, .input-bar { padding-left: 14px; padding-right: 14px; }
      .message-body { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-row">
          <div class="logo">🧬</div>
          <div>
            <h1>Reasoning RAG</h1>
            <p>Flask API /api/query</p>
          </div>
        </div>
        <button class="new-chat-btn" onclick="newChat()">+ 新建对话</button>
      </div>
      <div class="history-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Conversations</span>
        <button class="delete-btn" onclick="clearAllConversations()" title="清空全部会话" style="font-size:11px;">清空</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-history" id="empty-history">暂无历史会话，发送第一条消息开始。</div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="left">
          <div class="logo" style="width:34px;height:34px;border-radius:11px;">🧠</div>
          <div>
            <h2 id="chat-title">Reasoning RAG</h2>
            <p>Multi-hop QA Assistant</p>
          </div>
        </div>
        <div class="badge">
          <span class="badge-dot"></span>
          Backend Online
        </div>
      </header>

      <section class="chat-area" id="chat-area">
        <div class="welcome" id="welcome-screen">
          <h3>欢迎使用你的 RAG 助手</h3>
          <p>已连接到最新后端接口。你可以直接提问，系统会返回答案、置信度、检索统计和证据摘要。</p>
          <div class="prompt-grid">
            <button class="prompt-btn" onclick="fillQuestion('Which genes are associated with Lynch syndrome?')">Which genes are associated with Lynch syndrome?</button>
            <button class="prompt-btn" onclick="fillQuestion('How does trastuzumab work in HER2-positive breast cancer?')">How does trastuzumab work in HER2-positive breast cancer?</button>
            <button class="prompt-btn" onclick="fillQuestion('Explain the relationship between BRCA1 mutation and PARP inhibitors.')">Explain the relationship between BRCA1 mutation and PARP inhibitors.</button>
            <button class="prompt-btn" onclick="fillQuestion('Summarize key evidence for paraffin embedded tissue usage in Oncotype DX test.')">Summarize key evidence for paraffin embedded tissue usage in Oncotype DX test.</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <section class="input-bar">
        <div class="input-wrap">
          <textarea id="question-input" rows="1" placeholder="输入问题，按 Enter 发送，Shift+Enter 换行" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendQuestion()" aria-label="Send question">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="hint">当前请求地址：<code>/api/query</code></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "reasoning-rag-chat:v1";
    let conversations = [];
    let activeId = null;
    let isLoading = false;

    if (window.marked && typeof marked.setOptions === "function") {
      marked.setOptions({ breaks: true, gfm: true });
    }

    function renderMarkdown(raw) {
      const text = String(raw || "");
      if (!window.marked) return escHtml(text).replace(/\n/g, "<br/>");
      try {
        const html = marked.parse(text);
        return window.DOMPurify ? DOMPurify.sanitize(html) : html;
      } catch (err) {
        return escHtml(text).replace(/\n/g, "<br/>");
      }
    }

    function getActiveConversation() {
      return conversations.find((c) => c.id === activeId) || null;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.conversations)) conversations = data.conversations;
        if (data.activeId && conversations.some((c) => c.id === data.activeId)) {
          activeId = data.activeId;
        } else if (conversations.length) {
          activeId = conversations[0].id;
        }
      } catch (err) {
        console.warn("failed to restore conversations", err);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ conversations, activeId }));
      } catch (err) {
        console.warn("failed to persist conversations", err);
      }
    }

    function newChat() {
      const conv = { id: Date.now(), title: "新会话", messages: [] };
      conversations.unshift(conv);
      setActive(conv.id);
    }

    function setActive(id) {
      activeId = id;
      renderHistory();
      renderMessages();
      const conv = getActiveConversation();
      document.getElementById("chat-title").textContent = conv ? conv.title : "Reasoning RAG";
      saveState();
    }

    function deleteConversation(id, event) {
      event.stopPropagation();
      conversations = conversations.filter((c) => c.id !== id);
      if (id === activeId) {
        activeId = conversations.length ? conversations[0].id : null;
      }
      renderHistory();
      renderMessages();
      const conv = getActiveConversation();
      document.getElementById("chat-title").textContent = conv ? conv.title : "Reasoning RAG";
      saveState();
    }

    function clearAllConversations() {
      if (!conversations.length) return;
      if (!confirm("确定要清空所有历史对话吗？此操作不可撤销。")) return;
      conversations = [];
      activeId = null;
      renderHistory();
      renderMessages();
      document.getElementById("chat-title").textContent = "Reasoning RAG";
      saveState();
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      if (!conversations.length) {
        list.innerHTML = '<div class="empty-history">暂无历史会话，发送第一条消息开始。</div>';
        return;
      }

      list.innerHTML = "";
      conversations.forEach((conv) => {
        const userCount = conv.messages.filter((m) => m.role === "user").length;
        const lastTs = conv.messages.length ? conv.messages[conv.messages.length - 1].ts : Date.now();
        const item = document.createElement("div");
        item.className = "history-item" + (conv.id === activeId ? " active" : "");
        item.onclick = () => setActive(conv.id);
        item.innerHTML = `
          <div class="history-item-head">
            <div class="topic">${escHtml(conv.title)}</div>
            <button class="delete-btn" onclick="deleteConversation(${conv.id}, event)" title="删除会话">✕</button>
          </div>
          <div class="meta">${formatDate(lastTs)} · ${userCount} question(s)</div>
        `;
        list.appendChild(item);
      });
    }

    function renderMessages() {
      const welcome = document.getElementById("welcome-screen");
      const messagesEl = document.getElementById("messages");
      const conv = getActiveConversation();

      if (!conv || !conv.messages.length) {
        welcome.style.display = "block";
        messagesEl.innerHTML = "";
        return;
      }

      welcome.style.display = "none";
      messagesEl.innerHTML = "";
      conv.messages.forEach((msg) => {
        const node = msg.role === "user" ? makeUserBubble(msg) : makeBotBubble(msg);
        messagesEl.appendChild(node);
      });
      scrollToBottom();
    }

    function makeUserBubble(msg) {
      const el = document.createElement("div");
      el.className = "message user";
      el.innerHTML = `
        <div class="avatar">U</div>
        <div class="message-body">
          <div class="bubble">${escHtml(msg.text)}</div>
          <div class="message-meta">${formatTime(msg.ts)}</div>
        </div>
      `;
      return el;
    }

    function makeBotBubble(msg) {
      const el = document.createElement("div");
      el.className = "message bot";
      const data = msg.data || {};
      const analysis = data.analysis || {};
      const stats = data.stats || {};
      const verification = data.verification || {};
      const evidence = Array.isArray(data.evidence) ? data.evidence : [];
      const chain = Array.isArray(data.transparency_chain) ? data.transparency_chain : [];

      const chips = [
        chip("Confidence " + pct(data.confidence), (data.confidence || 0) >= 0.7),
        chip("Method " + (data.method || "n/a")),
        chip("Runtime " + number(data.runtime) + "s"),
        chip("Iterations " + intOrZero(data.iterations)),
        chip("Complexity " + number(analysis.complexity_score)),
        chip("Query Type " + (analysis.query_type || "unknown")),
        chip("Retriever AvgSim " + number(stats.avg_similarity)),
      ].join("");

      const evidenceHtml = evidence.length
        ? evidence.map((e) => `
            <div class="evidence-item">
              <div class="evidence-head">
                ${chip("Rank #" + intOrZero(e.rank))}
                ${chip("Quality " + number(e.quality))}
                ${chip("Similarity " + number(e.similarity))}
                ${chip("Hop " + intOrZero(e.hop))}
                ${e.source ? chip("Source " + escHtml(e.source)) : ""}
              </div>
              <div>${escHtml(e.text || "")}</div>
            </div>
          `).join("")
        : "<div>暂无证据摘要。</div>";

      const transparencyHtml = chain.length
        ? `<pre style="white-space:pre-wrap;word-break:break-word;font-family:inherit">${escHtml(JSON.stringify(chain, null, 2))}</pre>`
        : "<div>暂无 transparency_chain 数据。</div>";

      const analysisPanel = `
        <div>
          <div>is_complex: <strong>${analysis.is_complex ? "true" : "false"}</strong></div>
          <div>verification_confidence: <strong>${number(verification.confidence)}</strong></div>
          <div>verification_divergence: <strong>${number(verification.divergence)}</strong></div>
          <div>retrievals: <strong>${intOrZero(stats.total_retrievals)}</strong></div>
          <div>evidence_count: <strong>${intOrZero(stats.evidence_count)}</strong></div>
          <div>coverage: <strong>${number(stats.coverage)}</strong></div>
        </div>
      `;

      el.innerHTML = `
        <div class="avatar">AI</div>
        <div class="message-body">
          <div class="bubble markdown">${renderMarkdown(data.answer || "暂无回答。")}</div>
          <div class="chip-row">${chips}</div>
          <details class="panel">
            <summary>Analysis & Stats</summary>
            <div class="panel-body">${analysisPanel}</div>
          </details>
          <details class="panel">
            <summary>Evidence (${evidence.length})</summary>
            <div class="panel-body">${evidenceHtml}</div>
          </details>
          <details class="panel">
            <summary>Transparency Chain</summary>
            <div class="panel-body">${transparencyHtml}</div>
          </details>
          <div class="message-meta">
            <span>${formatTime(msg.ts)}</span>
            ${data.is_fallback ? '<span style="color:#fbbf24">fallback</span>' : ""}
          </div>
        </div>
      `;
      return el;
    }

    function chip(text, positive) {
      return `<span class="chip${positive ? " ok" : ""}">${text}</span>`;
    }

    function appendTyping() {
      const el = document.createElement("div");
      el.className = "message bot";
      el.innerHTML = `
        <div class="avatar">AI</div>
        <div class="message-body">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      `;
      document.getElementById("messages").appendChild(el);
      return el;
    }

    async function sendQuestion() {
      if (isLoading) return;
      const input = document.getElementById("question-input");
      const question = input.value.trim();
      if (!question) return;

      if (!activeId) newChat();
      const conv = getActiveConversation();
      if (!conv) return;

      if (conv.title === "新会话") {
        conv.title = question.length > 34 ? question.slice(0, 34) + "..." : question;
      }

      const userMsg = { role: "user", text: question, ts: Date.now() };
      conv.messages.push(userMsg);
      input.value = "";
      autoResize(input);
      isLoading = true;
      document.getElementById("send-btn").disabled = true;

      renderHistory();
      renderMessages();
      const typingEl = appendTyping();
      scrollToBottom();

      try {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question })
        });

        const json = await response.json();
        typingEl.remove();

        if (!response.ok || !json.ok) {
          showToast(json.error || "请求失败");
          conv.messages.pop();
        } else {
          conv.messages.push({
            role: "bot",
            data: json.data || {},
            ts: Date.now()
          });
          renderMessages();
        }
      } catch (err) {
        typingEl.remove();
        conv.messages.pop();
        showToast("网络错误: " + (err.message || "unknown"));
      } finally {
        isLoading = false;
        document.getElementById("send-btn").disabled = false;
        renderHistory();
        scrollToBottom();
        saveState();
      }
    }

    function fillQuestion(text) {
      if (!activeId) newChat();
      const input = document.getElementById("question-input");
      input.value = text;
      autoResize(input);
      input.focus();
    }

    function handleKey(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 170) + "px";
    }

    function scrollToBottom() {
      const area = document.getElementById("chat-area");
      setTimeout(() => { area.scrollTop = area.scrollHeight; }, 30);
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 4200);
    }

    function escHtml(raw) {
      return String(raw || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function number(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(3).replace(/\.?0+$/, "") : "0";
    }

    function pct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? Math.round(n * 100) + "%" : "0%";
    }

    function intOrZero(v) {
      const n = Number(v);
      return Number.isFinite(n) ? Math.round(n) : 0;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleDateString("zh-CN", { month: "short", day: "numeric" });
    }

    (function init() {
      loadState();
      renderHistory();
      renderMessages();
      const conv = getActiveConversation();
      document.getElementById("chat-title").textContent = conv ? conv.title : "Reasoning RAG";
    })();
  </script>
</body>
</html>
